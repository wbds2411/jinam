services:
  compass:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - ai
    restart: unless-stopped
  ai:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ai
      additional_contexts:
        commons: ${VIBE_COMMONS:-../../../ops/vibe/commons}
    volumes:
      - ai-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  ai-data:
